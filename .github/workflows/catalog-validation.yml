name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate index, sections, and links
        run: python3 scripts/validate_catalog.py
      - name: Smoke-test lookup
        run: python3 scripts/find_concept.py dialog

      - name: Test deterministic agent lookup
        run: python3 -m unittest discover -s tests -v

      - name: Generate static visual catalog
        run: python3 site/build.py
      - name: Test site routes, source and fallback
        run: python3 -m unittest discover -s site/tests -v

      - name: Test executable Button reference source
        run: node --test site/tests/button-runtime.test.cjs
      - name: Parse browser preview scripts
        run: |
          node --check site/src/previews/preview-runner.js
          node --check site/src/implementations/components/button/Button.js
          node --check site/src/implementations/components/button/scenarios.js

      - name: Test remaining core component references
        run: node --test site/tests/core-controls-runtime.test.cjs
      - name: Parse remaining component reference scripts
        run: |
          for component in input field select checkbox dialog; do
            case "$component" in
              input) source=Input ;;
              field) source=Field ;;
              select) source=Select ;;
              checkbox) source=Checkbox ;;
              dialog) source=Dialog ;;
            esac
            node --check "site/src/implementations/components/$component/$source.js"
            node --check "site/src/implementations/components/$component/scenarios.js"
          done

      - name: Test composed pattern source behaviors
        run: node --test site/tests/patterns-runtime.test.cjs
      - name: Parse all composed pattern scripts
        run: |
          for pattern in form navigation search-filter data-tables recovery; do
            case "$pattern" in
              form) source=Form ;;
              navigation) source=Navigation ;;
              search-filter) source=SearchFilter ;;
              data-tables) source=DataTables ;;
              recovery) source=Recovery ;;
            esac
            node --check "site/src/implementations/patterns/$pattern/$source.js"
            node --check "site/src/implementations/patterns/$pattern/scenarios.js"
          done

name: One-time nine-concept scorecard regeneration
on:
  push:
    branches:
      - review/full-quality-nine-concepts-20261119
    paths:
      - catalog/concept-scorecard.json
      - knowledge/foundations/visual-design-craftsmanship.md
      - tests/test_full_quality_batch.py
      - .github/workflows/scorecard-full-quality-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate synced scorecards
        run: |
          python -m pip install openpyxl==3.1.5
          python3 scripts/build_concept_scorecard.py --write
          python3 scripts/build_concept_scorecard_workbook.py
          python3 scripts/build_concept_scorecard.py --check
          python3 scripts/build_concept_scorecard_workbook.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit generated Markdown and XLSX to this branch
        env:
          TARGET: review/full-quality-nine-concepts-20261119
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONCEPT_SCORECARD.md CONCEPT_SCORECARD.xlsx
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git commit -m "build(scorecard): synchronize all nine full-quality editorial ratings"
          git push origin "HEAD:refs/heads/$TARGET"

name: One-time scorecard workbook regeneration
on:
  push:
    branches:
      - review/reassess-editorial-scorecard-20261119
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5
      - name: Rebuild canonical scorecard outputs
        run: |
          python3 scripts/build_concept_scorecard.py --write
          python3 scripts/build_concept_scorecard_workbook.py
          python3 scripts/build_concept_scorecard.py --check
          python3 scripts/build_concept_scorecard_workbook.py --check
      - name: Commit exact generator outputs and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/scorecard-rebuild-once.yml
          git add CONCEPT_SCORECARD.md CONCEPT_SCORECARD.xlsx .github/workflows/scorecard-rebuild-once.yml
          git commit -m "build(scorecard): regenerate synchronized Markdown and cached Excel" || exit 0
          git push
